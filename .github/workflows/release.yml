name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    # Enable after configuring the release environment and PyPI trusted publisher.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
