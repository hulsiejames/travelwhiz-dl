version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 28 * *"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 28 * *"
    open-pull-requests-limit: 1
