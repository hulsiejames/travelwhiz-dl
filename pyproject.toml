[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "versioningit>=3.1"]

[project]
name = "travelwhiz_dl"
description = "automated python downloads of travelwhiz curated feeds"
authors = [{name = "James Hulse"}]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version", "dependencies", "optional-dependencies"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Source = "https://github.com/hulsiejames/travelwhiz-dl"
Homepage = "https://github.com/hulsiejames/travelwhiz-dl"
"Bug Tracker" = "https://github.com/hulsiejames/travelwhiz-dl/issues"
Documentation = "https://travelwhiz-dl.readthedocs.io/en/stable/"

[project.scripts]
travelwhiz-dl = "travelwhiz_dl.__main__:command_line_main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"travelwhiz_dl" = ["py.typed"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = "requirements_dev.txt"}
docs = {file = "docs/requirements.txt"}

[tool.setuptools.cmdclass]
sdist = "versioningit.cmdclass.sdist"
build_py = "versioningit.cmdclass.build_py"

[tool.versioningit.vcs]
method = "git"
match = ["v*"]
default-tag = "0.0.1"

[tool.versioningit.onbuild]
source-file = "src/travelwhiz_dl/_version.py"
build-file = "travelwhiz_dl/_version.py"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.ruff]
target-version = "py311"
line-length = 95
extend-exclude = ["conf.py", "_version.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "BLE", "C90", "D", "DOC", "E", "ERA", "F", "FURB",
    "G", "I", "ICN", "LOG", "N", "PD", "PGH", "PIE", "PL", "PTH", "RET", "RUF",
    "S", "SIM", "T20", "TC", "TD", "TRY", "UP", "W",
]
ignore = [
    "D206", "D300", "E111", "E114", "E117", "W191",
    "ANN003", "DOC502", "S311", "SIM108", "TRY003", "UP015",
]
unfixable = ["B905", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pep8-naming]
ignore-names = ["df", "fn", "ca", "tp", "x", "i"]

[tool.ruff.lint.pylint]
max-args = 10
max-statements = 100

[tool.ruff.lint.extend-per-file-ignores]
# Generated descriptions escape backslashes and triple quotes for Python syntax.
"__init__.py" = ["F401", "D301"]
"tests/*" = ["S101", "DOC"]
"examples/*" = ["T20", "D205", "D400"]

[tool.pylint.main]
source-roots = ["src"]
ignore = ["__init__.py", "_version.py"]

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-statements = 100

[tool.pylint.basic]
extension-pkg-allow-list = []

[tool.pylint.messages_control]
disable = [
    "line-too-long", "too-many-lines", "use-dict-literal", "use-list-literal",
    "wrong-import-position", "wrong-import-order", "ungrouped-imports",
]

[tool.mypy]
packages = ["travelwhiz_dl"]
namespace_packages = true
ignore_missing_imports = true
allow_redefinition = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=travelwhiz_dl --cov-report=xml -n auto --doctest-modules --ignore=examples --junitxml=junit.xml -o junit_family=legacy"

[tool.coverage.report]
include_namespace_packages = true
